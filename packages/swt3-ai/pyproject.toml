[build-system]
requires = ["hatchling>=1.21,<1.27"]
build-backend = "hatchling.build"

[project]
name = "swt3-ai"
version = "0.5.5"
description = "SWT3 AI Witness SDK: cryptographic attestation for AI inference. 65 procedures, 41 namespaces, 5 languages, 14 profiles. EU AI Act, NIST AI RMF, CMMC, SR 11-7."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [{ name = "TeNova", email = "engineering@tenovaai.com" }]
keywords = [
    "ai", "compliance", "witness", "attestation", "swt3", "eu-ai-act", "nist-ai-rmf",
    "ai-governance", "ai-audit", "ai-accountability", "ai-observability",
    "llm-monitoring", "llm-observability", "model-risk-management",
    "compliance-as-code", "responsible-ai", "ai-safety", "ai-trust",
    "mlops", "nist-800-53", "cmmc", "fedramp", "gdpr", "sr-11-7",
    "cryptographic-attestation", "audit-trail", "openai", "anthropic",
    "agentic-ai", "multi-agent", "ai-agent", "guardrails", "ai-risk",
    "model-governance", "inference-logging", "ai-compliance-automation",
    "ollama", "vllm", "bedrock", "litellm", "nvidia-dynamo",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

# Zero hard dependencies — only stdlib
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
otel = ["opentelemetry-api>=1.0"]
dynamo = ["ai-dynamo>=0.8.0"]
gpu = ["pynvml>=11.0"]
yaml = ["pyyaml>=6.0"]
pqc = ["cryptography>=43.0"]
all = ["openai>=1.0", "anthropic>=0.20", "opentelemetry-api>=1.0", "pyyaml>=6.0"]
dev = ["pytest", "pytest-cov", "pytest-asyncio", "mypy", "ruff", "pyyaml>=6.0"]

[project.scripts]
swt3 = "swt3_ai.cli:main"

[project.urls]
Homepage = "https://tenova.io"
Documentation = "https://sovereign.tenova.io/docs/"
Repository = "https://github.com/tenova-labs/swt3-ai"
Issues = "https://github.com/tenova-labs/swt3-ai/issues"
"Assessment Playbook" = "https://sovereign.tenova.io/guides/assessment-playbook.html"
"NSA MCP Security Mapping" = "https://sovereign.tenova.io/guides/nsa-mcp-security-mapping.html"
"Live Demo" = "https://sovereign.tenova.io/audit/axm_audit_demo_eu_ai_act_public"
"Free Signup" = "https://sovereign.tenova.io/signup"

[tool.hatch.build]
# Do not respect parent repo's allowlist .gitignore — it blocks the package source
ignore-vcs = true
include = ["swt3_ai/**/*.py", "swt3_ai/templates/*.yaml", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["swt3_ai"]
exclude = ["swt3_ai/adapters/openshell.py"]

[tool.hatch.build.targets.sdist]
exclude = ["smoke_test.py", "test-vectors.json", "tests/", ".claude/", "swt3_ai/adapters/openshell.py"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.mypy]
python_version = "3.9"
strict = true

# SWT3 Compliance Gate -- Azure Pipelines
# Generated by: swt3 init --ci-template azure-pipelines
# Docs: https://sovereign.tenova.io/docs/
#
# Prerequisites:
#   1. Add SWT3_API_KEY as a secret variable in Pipelines > Library or pipeline YAML
#   2. Ensure swt3.yaml is checked into the repository root

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.12"

  - script: pip install --quiet swt3-ai==8.1.0
    displayName: Install SWT3 SDK

  - script: swt3 doctor --ci
    displayName: SWT3 Doctor

  - script: swt3 gate --validate
    displayName: Validate gate config

  - script: swt3 gate
    displayName: Run compliance gate
    env:
      SWT3_API_KEY: $(SWT3_API_KEY)

  - script: swt3 status --compact
    displayName: Check posture
    env:
      SWT3_API_KEY: $(SWT3_API_KEY)

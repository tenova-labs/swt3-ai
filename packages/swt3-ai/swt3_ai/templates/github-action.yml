# SWT3 Compliance Gate -- GitHub Action
# Generated by: swt3 init --ci-template
# Docs: https://sovereign.tenova.io/docs/

name: SWT3 Compliance Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  swt3-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SWT3 SDK
        run: pip install swt3-ai

      - name: Validate gate config
        run: swt3 gate --validate

      - name: Run compliance gate
        env:
          SWT3_API_KEY: ${{ secrets.SWT3_API_KEY }}
        run: swt3 gate

      - name: Check posture
        env:
          SWT3_API_KEY: ${{ secrets.SWT3_API_KEY }}
        run: swt3 status --compact

# SWT3 Compliance Gate -- GitLab CI
# Generated by: swt3 init --ci-template gitlab
# Docs: https://sovereign.tenova.io/docs/
#
# Prerequisites:
#   1. Add SWT3_API_KEY as a masked CI/CD variable in Settings > CI/CD > Variables
#   2. Ensure swt3.yaml is checked into the repository root

swt3-gate:
  stage: test
  image: python:3.12-slim

  before_script:
    - pip install --quiet swt3-ai==8.1.0

  script:
    - swt3 doctor --ci
    - swt3 gate --validate
    - swt3 gate
    - swt3 status --compact

  variables:
    SWT3_API_KEY: $SWT3_API_KEY

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

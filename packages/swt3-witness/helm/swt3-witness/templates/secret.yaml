{{- if .Values.cloud.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "swt3-witness.fullname" . }}
  labels:
    {{- include "swt3-witness.labels" . | nindent 4 }}
type: Opaque
stringData:
  SWT3_API_KEY: {{ .Values.cloud.apiKey | quote }}
  SWT3_TENANT_ID: {{ required "cloud.tenantId is required when cloud.apiKey is set" .Values.cloud.tenantId | quote }}
  SWT3_ENDPOINT: {{ .Values.cloud.endpoint | quote }}
  {{- if .Values.cloud.signingKey }}
  SWT3_SIGNING_KEY: {{ .Values.cloud.signingKey | quote }}
  {{- end }}
{{- end }}

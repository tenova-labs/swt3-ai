apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Injects the SWT3 witness sidecar into Deployments.
# By default, patches ALL Deployments in the kustomization.
# To target specific workloads, add labelSelector or name:
#
#   patches:
#     - path: sidecar-patch.yaml
#       target:
#         kind: Deployment
#         labelSelector: "swt3.io/witness=enabled"

patches:
  - path: sidecar-patch.yaml
    target:
      kind: Deployment

family: "AI"
family_name: "AI Governance & Inference Integrity"
controls:
  # ── Technical Controls (automated via AI witness pipeline) ──────

  - id: "AI-1.1"
    parent_control: "AI-1"
    name: "Inference Provenance - Prompt Hashing"
    description: "All AI inference prompts are SHA-256 hashed and anchored to the SWT3 ledger"
    command: "${AXIOM_HOME}/tools/axiom-ai-witness --check prompt-hashing"
    factor_a: 1
    factor_a_label: "prompt_hashing_required"
    factor_b_source: "api_check"
    factor_b_label: "prompt_hashing_active"
    factor_c_source: "none"
    rule_expression: "factor_b >= factor_a"
    uct_category: "AI"
    nist_800_53_ref: "SI-7"
    nist_ai_rmf_ref: "MEASURE 2.5"

  - id: "AI-1.2"
    parent_control: "AI-1"
    name: "Inference Provenance - Response Anchoring"
    description: "All AI inference responses are SHA-256 hashed and anchored to the SWT3 ledger"
    command: "${AXIOM_HOME}/tools/axiom-ai-witness --check response-anchoring"
    factor_a: 1
    factor_a_label: "response_anchoring_required"
    factor_b_source: "api_check"
    factor_b_label: "response_anchoring_active"
    factor_c_source: "none"
    rule_expression: "factor_b >= factor_a"
    uct_category: "AI"
    nist_800_53_ref: "SI-7"
    nist_ai_rmf_ref: "MANAGE 2.2"

  - id: "AI-1.3"
    parent_control: "AI-1"
    name: "Inference Provenance - Model Identifier Recorded"
    description: "Model identifier (name + version) is captured with each inference anchor. Optional lifecycle_stage field (design, development, testing, deployment, monitoring, decommission) enables MAP 1.3 lifecycle stage characterization."
    command: "${AXIOM_HOME}/tools/axiom-ai-witness --check model-identifier"
    factor_a: 1
    factor_a_label: "model_id_required"
    factor_b_source: "api_check"
    factor_b_label: "model_id_present"
    factor_c_source: "none"
    factor_c_label: "lifecycle_stage"
    rule_expression: "factor_b >= factor_a"
    uct_category: "AI"
    nist_800_53_ref: "AU-3"
    nist_ai_rmf_ref: "MAP 4.1"
    supplemental_ai_rmf_ref: "MAP 1.3"

  - id: "AI-2.1"
    parent_control: "AI-2"
    name: "Inference Logging - Witness Anchor Minting"
    description: "Each AI inference produces a cryptographic SWT3 Witness Anchor in the ledger"
    command: "${AXIOM_HOME}/tools/axiom-ai-witness --check witness-minting"
    factor_a: 1
    factor_a_label: "witness_minting_required"
    factor_b_source: "api_check"
    factor_b_label: "witness_minting_active"
    factor_c_source: "none"
    rule_expression: "factor_b >= factor_a"
    uct_category: "AI"
    nist_800_53_ref: "AU-2"
    nist_ai_rmf_ref: "GOVERN 1.7"

  - id: "AI-2.2"
    parent_control: "AI-2"
    name: "Inference Logging - Latency Threshold"
    description: "AI inference latency is captured and stays within defined threshold (< 30s)"
    command: "${AXIOM_HOME}/tools/axiom-ai-witness --check latency-threshold"
    factor_a: 30000
    factor_a_label: "max_latency_ms"
    factor_b_source: "api_check"
    factor_b_label: "p95_latency_ms"
    factor_c_source: "none"
    rule_expression: "factor_b <= factor_a"
    uct_category: "AI"
    nist_800_53_ref: "SI-4"
    nist_ai_rmf_ref: "MEASURE 2.5"

  - id: "AI-2.3"
    parent_control: "AI-2"
    name: "Inference Logging - Token Usage Tracking"
    description: "Token consumption (input + output) is recorded per inference"
    command: "${AXIOM_HOME}/tools/axiom-ai-witness --check token-tracking"
    factor_a: 1
    factor_a_label: "token_tracking_required"
    factor_b_source: "api_check"
    factor_b_label: "token_tracking_active"
    factor_c_source: "none"
    rule_expression: "factor_b >= factor_a"
    uct_category: "AI"
    nist_800_53_ref: "AU-3"
    nist_ai_rmf_ref: "MEASURE 2.5"

  # ── Attestation Controls (organizational/procedural) ────────────

  - id: "AI-3.1"
    parent_control: "AI-3"
    name: "AI Risk Management Framework"
    check_type: "attestation"
    description: "Organization has adopted an AI risk management framework aligned with NIST AI RMF"
    attestation_prompt: "Confirm your organization has adopted a documented AI risk management framework."
    review_interval_days: 365
    uct_category: "POL"
    nist_800_53_ref: "PL-2"
    nist_ai_rmf_ref: "GOVERN 1.1"

  - id: "AI-3.2"
    parent_control: "AI-3"
    name: "AI Model Inventory"
    check_type: "attestation"
    description: "Organization maintains an inventory of all AI/ML models in production"
    attestation_prompt: "Confirm an up-to-date inventory of deployed AI/ML models is maintained."
    review_interval_days: 90
    uct_category: "POL"
    nist_800_53_ref: "CM-8"
    nist_ai_rmf_ref: "GOVERN 1.5"

  - id: "AI-3.3"
    parent_control: "AI-3"
    name: "AI Acceptable Use Policy"
    check_type: "attestation"
    description: "Organization has documented acceptable use policies for AI systems"
    attestation_prompt: "Confirm AI acceptable use policies are documented and communicated to users."
    review_interval_days: 365
    uct_category: "POL"
    nist_800_53_ref: "PL-4"
    nist_ai_rmf_ref: "GOVERN 2.1"

  - id: "AI-4.1"
    parent_control: "AI-4"
    name: "AI Output Review Process"
    check_type: "attestation"
    description: "Human review processes exist for high-impact AI decisions"
    attestation_prompt: "Confirm human-in-the-loop review processes exist for critical AI outputs."
    review_interval_days: 180
    uct_category: "POL"
    nist_800_53_ref: "SI-4"
    nist_ai_rmf_ref: "MANAGE 2.2"

  - id: "AI-4.2"
    parent_control: "AI-4"
    name: "AI Incident Response"
    check_type: "attestation"
    description: "Organization has incident response procedures for AI system failures or misuse"
    attestation_prompt: "Confirm incident response procedures address AI-specific failure modes."
    review_interval_days: 365
    uct_category: "POL"
    nist_800_53_ref: "IR-4"
    nist_ai_rmf_ref: "MANAGE 4.1"

  - id: "AI-4.3"
    parent_control: "AI-4"
    name: "AI Data Governance"
    check_type: "attestation"
    description: "Data used for AI training and inference is governed under data management policies"
    attestation_prompt: "Confirm data governance policies cover AI training data and inference inputs."
    review_interval_days: 365
    uct_category: "POL"
    nist_800_53_ref: "SI-12"
    nist_ai_rmf_ref: "MAP 4.1"

  # ── AI RMF Gap Closure Procedures (v5.43.0) ──────────────────────

  - id: "AI-GOV.6"
    parent_control: "AI-GOV"
    name: "AI Risk Management Scope Definition"
    check_type: "attestation"
    description: "Organization has documented which AI systems are in scope for risk management, their intended purposes, deployment contexts, and risk tolerances"
    attestation_prompt: "Confirm AI risk management scope is documented including in-scope systems, intended purposes, and risk tolerances."
    review_interval_days: 365
    uct_category: "POL"
    nist_800_53_ref: "SA-3"
    nist_ai_rmf_ref: "GOVERN 1.3"

  - id: "AI-RISK.1"
    parent_control: "AI-RISK"
    name: "AI Risk Identification and Categorization"
    check_type: "attestation"
    description: "Organization has identified AI risk sources, assigned risk categories, and documented residual risk acceptance decisions"
    attestation_prompt: "Confirm AI risk register exists with identified risk sources, assigned categories, and documented residual risk."
    review_interval_days: 365
    uct_category: "POL"
    nist_800_53_ref: "RA-2"
    nist_ai_rmf_ref: "MAP 2.1"

  - id: "AI-IR.1"
    parent_control: "AI-IR"
    name: "AI Incident Response Capability"
    check_type: "attestation"
    description: "Organization has AI-specific incident response procedures covering detection, containment, recovery, and post-incident review for AI system failures"
    attestation_prompt: "Confirm AI incident response plan exists covering model recall, guardrail bypass, data contamination, and shadow AI scenarios."
    review_interval_days: 365
    uct_category: "POL"
    nist_800_53_ref: "IR-8"
    nist_ai_rmf_ref: "MANAGE 3.1"

  - id: "AI-GOV.7"
    parent_control: "AI-GOV"
    name: "AI Governance Resource Allocation"
    check_type: "attestation"
    description: "Organization has allocated adequate resources (budget, staffing, compute) for AI risk management and governance activities"
    attestation_prompt: "Confirm budget, staffing, and compute resources are allocated for AI governance and documented in the QMS."
    review_interval_days: 365
    uct_category: "POL"
    nist_800_53_ref: "PM-3"
    nist_ai_rmf_ref: "GOVERN 2.2"

  - id: "AI-IMPACT.1"
    parent_control: "AI-IMPACT"
    name: "AI Societal Impact Assessment"
    check_type: "attestation"
    description: "Organization has conducted a community and societal-level impact assessment for deployed AI systems beyond individual bias metrics"
    attestation_prompt: "Confirm societal impact assessment is documented including affected communities, disproportionate impact evaluation, and mitigation measures."
    review_interval_days: 365
    uct_category: "POL"
    nist_800_53_ref: "RA-3"
    nist_ai_rmf_ref: "MAP 5.2"

  - id: "AI-CHAIN.1"
    parent_control: "AI-CHAIN"
    name: "Multi-Agent Chain Witnessing"
    check_type: "attestation"
    description: "Witness a handoff between agents in a multi-agent chain with cycle tracking"
    attestation_prompt: "Confirm multi-agent chain handoffs are witnessed with cycle_id binding and chain depth tracking."
    review_interval_days: 90
    uct_category: "AI"
    nist_800_53_ref: "AU-3"
    nist_ai_rmf_ref: "MANAGE 4.1"
    eu_ai_act_ref: "Art. 12(2)(a)"

  - id: "AI-VIO.1"
    parent_control: "AI-VIO"
    name: "Violation Reporting"
    check_type: "attestation"
    description: "Witness a policy violation detected during or after inference"
    attestation_prompt: "Confirm policy violations detected during inference are witnessed with severity and policy classification."
    review_interval_days: 90
    uct_category: "AI"
    nist_800_53_ref: "SI-4"
    nist_ai_rmf_ref: "MANAGE 3.2"
    eu_ai_act_ref: "Art. 9(4)(a)"

  - id: "AI-CHR.1"
    parent_control: "AI-CHR"
    name: "Agent Charter Attestation"
    check_type: "attestation"
    description: "Witness the charter or system prompt hash governing an agent's behavior"
    attestation_prompt: "Confirm agent charter hashes are attested at deployment and verified before inference."
    review_interval_days: 90
    uct_category: "AI"
    nist_800_53_ref: "SA-4"
    nist_ai_rmf_ref: "GOVERN 1.2"
    eu_ai_act_ref: "Art. 13"

  - id: "AI-MDL.8"
    parent_control: "AI-MDL"
    name: "Model Registry Check"
    check_type: "attestation"
    description: "Witness that a model was verified against an approved registry before deployment"
    attestation_prompt: "Confirm models are checked against the approved registry before production deployment."
    review_interval_days: 90
    uct_category: "AI"
    nist_800_53_ref: "CM-8"
    nist_ai_rmf_ref: "MANAGE 1.3"
    eu_ai_act_ref: "Art. 51"

  - id: "AI-HITL.3"
    parent_control: "AI-HITL"
    name: "Reviewer Identity Binding"
    check_type: "attestation"
    description: "Witness the identity of the natural person who performed a human review or override"
    attestation_prompt: "Confirm reviewer identity is cryptographically bound to human oversight decisions with four-eyes enforcement where required."
    review_interval_days: 90
    uct_category: "AI"
    nist_800_53_ref: "AU-3"
    nist_ai_rmf_ref: "GOVERN 1.4"
    eu_ai_act_ref: "Art. 12(3)(d), Art. 14(5)"

  - id: "AI-SAFE.1"
    parent_control: "AI-SAFE"
    name: "Safe State Attestation"
    check_type: "attestation"
    description: "Witness that a stop or interrupt mechanism exists and the system reached safe state"
    attestation_prompt: "Confirm stop/interrupt mechanism is implemented, tested, and system safe state is verified after invocation."
    review_interval_days: 90
    uct_category: "AI"
    nist_800_53_ref: "CP-2"
    nist_ai_rmf_ref: "MANAGE 4.1"
    eu_ai_act_ref: "Art. 14(4)(e)"

  - id: "AI-HW.1"
    parent_control: "AI-HW"
    name: "Hardware Attestation"
    check_type: "attestation"
    description: "Witness accelerator hardware inventory (GPU count, topology, interconnect) at service startup"
    attestation_prompt: "Confirm GPU hardware inventory is attested at service startup with topology and health verification."
    review_interval_days: 90
    uct_category: "AI"
    nist_800_53_ref: "CM-8"
    nist_ai_rmf_ref: "MANAGE 1.3"
    eu_ai_act_ref: "Art. 15(4)"

  - id: "AI-HW.3"
    parent_control: "AI-HW"
    name: "TPM Platform Attestation"
    check_type: "attestation"
    description: "Witness TPM 2.0 PCR register state proving host firmware integrity and hardware root of trust"
    attestation_prompt: "Confirm TPM 2.0 platform attestation is performed at service startup with PCR register integrity verification."
    review_interval_days: 90
    uct_category: "AI"
    nist_800_53_ref: "SC-12"
    nist_ai_rmf_ref: "MANAGE 1.3"
    eu_ai_act_ref: "Art. 15(4)"

  - id: "AI-TRUST.1"
    parent_control: "AI-TRUST"
    name: "Trust Verification"
    check_type: "attestation"
    description: "Witness mutual compliance trust verification between AI agents before interaction"
    attestation_prompt: "Confirm agents verify counterpart compliance posture before exchanging data or invoking tools."
    review_interval_days: 90
    uct_category: "AI"
    nist_800_53_ref: "IA-8"
    nist_ai_rmf_ref: "GOVERN 1.2"
    eu_ai_act_ref: "Art. 9(4)(c)"

  - id: "AI-TRUST.2"
    parent_control: "AI-TRUST"
    name: "Trust Handshake"
    check_type: "attestation"
    description: "Witness the detailed handshake result of a trust verification between agents"
    attestation_prompt: "Confirm trust handshake details (checks performed, checks passed, grant/deny) are recorded per interaction."
    review_interval_days: 90
    uct_category: "AI"
    nist_800_53_ref: "AU-3"
    nist_ai_rmf_ref: "MANAGE 4.1"
    eu_ai_act_ref: "Art. 12(2)(a)"

  # ── SDK Procedure Attestation Entries (v5.71.0) ────────────────
  # These procedures are witnessed by the SDK during inference.
  # Attestation entries enable organizational tracking and review.

  # --- Inference (INF) ---

  - id: "AI-INF.1"
    parent_control: "AI-INF"
    name: "Inference Provenance"
    check_type: "attestation"
    description: "All AI inference prompts and responses are SHA-256 hashed and anchored to the SWT3 ledger for provenance tracking"
    attestation_prompt: "Confirm inference provenance hashing is active and all prompt/response pairs are witnessed."
    review_interval_days: 90
    uct_category: "AI"
    nist_800_53_ref: "SI-7"
    nist_ai_rmf_ref: "MEASURE 2.5"
    eu_ai_act_ref: "Art. 12(1)"

  - id: "AI-INF.2"
    parent_control: "AI-INF"
    name: "Inference Latency"
    check_type: "attestation"
    description: "AI inference latency is captured and stays within defined performance threshold"
    attestation_prompt: "Confirm inference latency monitoring is configured with appropriate thresholds."
    review_interval_days: 90
    uct_category: "AI"
    nist_800_53_ref: "SI-4"
    nist_ai_rmf_ref: "MEASURE 2.5"
    eu_ai_act_ref: "Art. 12(2)"

  - id: "AI-INF.3"
    parent_control: "AI-INF"
    name: "Inference Volume"
    check_type: "attestation"
    description: "AI inference volume is governed with hourly rate limits to prevent abuse and ensure resource allocation"
    attestation_prompt: "Confirm inference rate limits are configured and volume monitoring is active."
    review_interval_days: 90
    uct_category: "AI"
    nist_800_53_ref: "AU-3"
    nist_ai_rmf_ref: "MANAGE 2.2"
    eu_ai_act_ref: "Art. 12(1)"

  # --- Model Lifecycle (MDL) ---

  - id: "AI-MDL.1"
    parent_control: "AI-MDL"
    name: "Model Weight Integrity"
    check_type: "attestation"
    description: "Deployed model hash matches the approved hash in the model registry"
    attestation_prompt: "Confirm model weight integrity verification is active and hash mismatches trigger alerts."
    review_interval_days: 90
    uct_category: "AI"
    nist_800_53_ref: "SI-7"
    nist_ai_rmf_ref: "MANAGE 1.3"
    eu_ai_act_ref: "Art. 9(4)(a)"

  - id: "AI-MDL.2"
    parent_control: "AI-MDL"
    name: "Model Version Tracking"
    check_type: "attestation"
    description: "Model version identifier is recorded with each inference anchor"
    attestation_prompt: "Confirm model version identifiers are captured and recorded with every inference."
    review_interval_days: 90
    uct_category: "AI"
    nist_800_53_ref: "CM-8"
    nist_ai_rmf_ref: "MAP 4.1"
    eu_ai_act_ref: "Art. 12(2)(b)"

  - id: "AI-MDL.3"
    parent_control: "AI-MDL"
    name: "Model Drift Detection"
    check_type: "attestation"
    description: "Model drift scoring detects distribution shift and behavioral changes over time"
    attestation_prompt: "Confirm drift detection is configured with defined thresholds and review cadence."
    review_interval_days: 90
    uct_category: "AI"
    nist_800_53_ref: "SI-4"
    nist_ai_rmf_ref: "MEASURE 2.6"
    eu_ai_act_ref: "Art. 72(1)"

  - id: "AI-MDL.5"
    parent_control: "AI-MDL"
    name: "Weight File Integrity"
    check_type: "attestation"
    description: "Model weight file SHA-256 hash is verified before deployment to prevent unauthorized modification"
    attestation_prompt: "Confirm weight file hash verification is performed before every model load or deployment."
    review_interval_days: 90
    uct_category: "AI"
    nist_800_53_ref: "SI-7"
    nist_ai_rmf_ref: "MANAGE 1.3"
    eu_ai_act_ref: "Art. 11"

  - id: "AI-MDL.6"
    parent_control: "AI-MDL"
    name: "Adapter Stack Attestation"
    check_type: "attestation"
    description: "LoRA/PEFT adapter stack configuration is attested and tracked for each model deployment"
    attestation_prompt: "Confirm adapter stack configurations are recorded and verified against approved adapters."
    review_interval_days: 90
    uct_category: "AI"
    nist_800_53_ref: "CM-8"
    nist_ai_rmf_ref: "MANAGE 1.3"
    eu_ai_act_ref: "Art. 11"

  - id: "AI-MDL.7"
    parent_control: "AI-MDL"
    name: "Quantization Attestation"
    check_type: "attestation"
    description: "Model quantization parameters are recorded to track precision and performance tradeoffs"
    attestation_prompt: "Confirm quantization parameters are documented and performance impact is assessed."
    review_interval_days: 90
    uct_category: "AI"
    nist_800_53_ref: "CM-8"
    nist_ai_rmf_ref: "MANAGE 1.3"

  # --- Guardrails (GRD) ---

  - id: "AI-GRD.1"
    parent_control: "AI-GRD"
    name: "Guardrail Enforcement"
    check_type: "attestation"
    description: "Safety guardrails are active and enforced on all AI inference outputs"
    attestation_prompt: "Confirm safety guardrails are deployed, tested, and enforced on all production inference."
    review_interval_days: 90
    uct_category: "AI"
    nist_800_53_ref: "SI-10"
    nist_ai_rmf_ref: "MANAGE 2.2"
    eu_ai_act_ref: "Art. 9(2)(a)"

  - id: "AI-GRD.2"
    parent_control: "AI-GRD"
    name: "Content Safety Filter"
    check_type: "attestation"
    description: "Output content safety classification is applied to filter harmful or inappropriate content"
    attestation_prompt: "Confirm content safety filters are configured and output classification is active."
    review_interval_days: 90
    uct_category: "AI"
    nist_800_53_ref: "SI-10"
    nist_ai_rmf_ref: "MANAGE 2.2"
    eu_ai_act_ref: "Art. 15(3)"

  - id: "AI-GRD.3"
    parent_control: "AI-GRD"
    name: "PII Redaction"
    check_type: "attestation"
    description: "PII detection and redaction is applied to AI inference inputs and outputs"
    attestation_prompt: "Confirm PII redaction is configured for all AI inference pipelines handling personal data."
    review_interval_days: 90
    uct_category: "AI"
    nist_800_53_ref: "SI-12"
    nist_ai_rmf_ref: "MANAGE 2.2"
    eu_ai_act_ref: "Art. 10(2)(f)"

  # --- Fairness (FAIR) ---

  - id: "AI-FAIR.1"
    parent_control: "AI-FAIR"
    name: "Bias Disparity Measurement"
    check_type: "attestation"
    description: "Bias disparity ratios are measured across demographic groups"
    attestation_prompt: "Confirm bias disparity measurement is performed with documented methodology and thresholds."
    review_interval_days: 180
    uct_category: "AI"
    nist_800_53_ref: "RA-3"
    nist_ai_rmf_ref: "MAP 2.3"
    eu_ai_act_ref: "Art. 10(2)(f)"

  - id: "AI-FAIR.2"
    parent_control: "AI-FAIR"
    name: "Fairness Calibration"
    check_type: "attestation"
    description: "Fairness calibration scores are tracked to ensure equitable model behavior"
    attestation_prompt: "Confirm fairness calibration scoring is implemented and reviewed periodically."
    review_interval_days: 180
    uct_category: "AI"
    nist_800_53_ref: "RA-3"
    nist_ai_rmf_ref: "MEASURE 2.6"
    eu_ai_act_ref: "Art. 9(4)(a)"

  - id: "AI-FAIR.3"
    parent_control: "AI-FAIR"
    name: "Bias Audit Witnessing"
    check_type: "attestation"
    description: "Bias audit results are witnessed with demographic group counts and disparity measurements"
    attestation_prompt: "Confirm bias audits are conducted with documented methodology, group definitions, and disparity thresholds."
    review_interval_days: 180
    uct_category: "AI"
    nist_800_53_ref: "RA-3"
    nist_ai_rmf_ref: "MAP 2.3"
    eu_ai_act_ref: "Art. 10(2)(f)"

  # --- Data Governance (DATA) ---

  - id: "AI-DATA.1"
    parent_control: "AI-DATA"
    name: "Training Data Provenance"
    check_type: "attestation"
    description: "Training data sources are documented with provenance and lineage information"
    attestation_prompt: "Confirm training data provenance is documented including sources, collection methods, and consent basis."
    review_interval_days: 365
    uct_category: "AI"
    nist_800_53_ref: "SI-12"
    nist_ai_rmf_ref: "MAP 4.1"
    eu_ai_act_ref: "Art. 10(2)(a)"

  - id: "AI-DATA.2"
    parent_control: "AI-DATA"
    name: "Training Data License Compliance"
    check_type: "attestation"
    description: "Training data licenses are verified for compliance before use in model training"
    attestation_prompt: "Confirm all training data licenses are reviewed and compliant with usage terms."
    review_interval_days: 365
    uct_category: "AI"
    nist_800_53_ref: "SI-12"
    nist_ai_rmf_ref: "MAP 4.1"
    eu_ai_act_ref: "Art. 10(2)(a)"

  - id: "AI-DATA.3"
    parent_control: "AI-DATA"
    name: "Training Data Statistics"
    check_type: "attestation"
    description: "Training dataset statistical properties are documented including size, features, and class balance"
    attestation_prompt: "Confirm training data statistics (sample count, features, class balance) are documented and reviewed."
    review_interval_days: 180
    uct_category: "AI"
    nist_800_53_ref: "SI-12"
    nist_ai_rmf_ref: "MAP 4.1"
    eu_ai_act_ref: "Art. 10(3)"

  - id: "AI-DATA.4"
    parent_control: "AI-DATA"
    name: "Training Data PII Lifecycle"
    check_type: "attestation"
    description: "PII in training data is managed through a defined lifecycle including pseudonymization, deletion, and access control"
    attestation_prompt: "Confirm PII lifecycle management is implemented for all training data with documented procedures."
